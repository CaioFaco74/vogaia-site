name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (Next.js static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via rsync (preserva /posts/)
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete --exclude=posts/ \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            out/ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/vogaia.com.br/public_html/"

      - name: Ajustar permissoes
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            'find ~/domains/vogaia.com.br/public_html -type d -exec chmod 755 {} \; && find ~/domains/vogaia.com.br/public_html -type f -exec chmod 644 {} \;'
